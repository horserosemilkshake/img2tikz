name: Build

on:
  push:
  pull_request:

jobs:
  linux-make-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            make

      - name: Build (make)
        run: make

  linux-cmake-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            cmake \
            ninja-build

      - name: Configure (cmake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (cmake)
        run: cmake --build build --config Release

  windows-make-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build (make)
        shell: msys2 {0}
        run: make

  windows-cmake-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (cmake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (cmake)
        run: cmake --build build --config Release
