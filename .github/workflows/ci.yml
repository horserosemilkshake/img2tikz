name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            make \
            ffmpeg \
            texlive-latex-base \
            texlive-pictures

      - name: Build
        run: make

      - name: End-to-end test
        run: |
          MAX_SIDE=1024 QUANT_STEP=16 bash test/generate_all.sh

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: img2tikz-test-artifacts
          path: |
            test/tikz-output
            test/pdf-output
