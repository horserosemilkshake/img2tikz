name: Coverage

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            make \
            gcovr

      - name: Run coverage
        run: make coverage

      - name: Generate XML/HTML reports
        run: |
          gcovr --root . --xml-pretty --output coverage.xml
          gcovr --root . --html-details --output coverage.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.html
            *.gcov
