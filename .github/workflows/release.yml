name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            make

      - name: Build (make)
        run: make

      - name: Package Linux binary
        run: |
          mkdir -p dist
          cp img2tikz dist/img2tikz-linux-x86_64
          tar -C dist -czf "img2tikz-${RELEASE_TAG}-linux-x86_64.tar.gz" img2tikz-linux-x86_64

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2tikz-linux-package
          path: img2tikz-${{ env.RELEASE_TAG }}-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build (make)
        shell: msys2 {0}
        run: make

      - name: Package Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if (Test-Path img2tikz.exe) {
            Copy-Item img2tikz.exe dist/img2tikz-windows-x86_64.exe -Force
          } elseif (Test-Path img2tikz) {
            Copy-Item img2tikz dist/img2tikz-windows-x86_64.exe -Force
          } else {
            throw "Built binary not found (expected img2tikz.exe or img2tikz)."
          }
          Compress-Archive -Path dist/img2tikz-windows-x86_64.exe -DestinationPath "img2tikz-$env:RELEASE_TAG-windows-x86_64.zip" -Force

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2tikz-windows-package
          path: img2tikz-${{ env.RELEASE_TAG }}-windows-x86_64.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download Linux package artifact
        uses: actions/download-artifact@v4
        with:
          name: img2tikz-linux-package
          path: release-assets

      - name: Download Windows package artifact
        uses: actions/download-artifact@v4
        with:
          name: img2tikz-windows-package
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/img2tikz-${{ env.RELEASE_TAG }}-linux-x86_64.tar.gz
            release-assets/img2tikz-${{ env.RELEASE_TAG }}-windows-x86_64.zip
